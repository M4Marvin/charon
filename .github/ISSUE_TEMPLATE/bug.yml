name: Bug report
description: Something in Charon is broken.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, provider tokens, or private chat content. Redact logs before posting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
      placeholder: I clicked Import and the page showed...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest reliable sequence.
      placeholder: |
        1. Open Characters
        2. Click Import PNG
        3. Choose a V3 card
        4. ...
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install Charon?
      options:
        - macOS / Linux installer
        - Windows installer
        - Docker image
        - From source
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `charon --version`, or the Docker image tag.
      placeholder: 0.1.3
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and browser
      placeholder: macOS 15.2, Safari 18 / Windows 11, Firefox 134 / Ubuntu 24.04, Chrome 133
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "`charon logs`, or `docker logs charon`. Redact secrets."
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I removed API keys, tokens, and private chat content from this report.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
